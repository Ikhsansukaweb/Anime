<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SannShop - Order Produk</title>

<!-- Font & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<style>
  /* Root & Colors */
  :root {
    --accent-green: #00ff88;
    --accent-green-glow: rgba(0, 255, 136, 0.6);
    --background-dark: #0a0d18;
    --background-gradient-start: #002830;
    --background-gradient-end: #005742;
    --danger: #ff4b57;
  }

  /* Reset & base */
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0; padding: 0;
    background: linear-gradient(135deg, var(--background-dark), var(--background-gradient-start), var(--background-gradient-end));
    font-family: 'Poppins', sans-serif;
    color: var(--accent-green);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
  }

  /* Container */
  .order-container {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(135deg, #00372aaa, #00663daa);
    border-radius: 30px;
    padding: 30px 25px 40px;
    box-shadow:
      0 0 30px var(--accent-green-glow),
      inset 0 0 60px #00663dcc;
    position: relative;
    overflow: hidden;
  }

  /* Background geometric shapes */
  .order-container::before {
    content: '';
    position: absolute;
    top: -90px; left: -60px;
    width: 180px; height: 180px;
    background: linear-gradient(135deg, #00ff8855, #00482f88);
    clip-path: polygon(0 0, 100% 0, 0 100%);
    filter: drop-shadow(0 0 12px var(--accent-green));
    border-radius: 25px;
    z-index: 0;
  }
  .order-container::after {
    content: '';
    position: absolute;
    bottom: -90px; right: -60px;
    width: 180px; height: 180px;
    background: linear-gradient(315deg, #00ff8855, #00482f88);
    clip-path: polygon(100% 100%, 100% 0, 0 100%);
    filter: drop-shadow(0 0 12px var(--accent-green));
    border-radius: 25px;
    z-index: 0;
  }

  /* Title area */
  h1 {
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    font-size: 2rem;
    margin: 0 0 8px;
    text-shadow: 0 0 12px var(--accent-green);
    position: relative;
    z-index: 1;
  }
  .price {
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 24px;
    text-shadow: 0 0 10px var(--accent-green);
    position: relative;
    z-index: 1;
  }

  /* Form */
  form {
    position: relative;
    z-index: 1;
  }

  label {
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
    color: var(--accent-green);
    text-shadow: 0 0 7px #00ff8866;
    font-size: 0.9rem;
  }

  input[type="text"],
  input[type="number"],
  select,
  input[type="file"] {
    width: 100%;
    padding: 15px 18px;
    border-radius: 15px;
    border: 1.8px solid #00482f;
    background: #003d24cc;
    color: var(--accent-green);
    font-size: 1rem;
    font-family: inherit;
    box-shadow: inset 0 0 10px #00ff8866;
    transition: all 0.3s ease;
    margin-bottom: 20px;
  }
  input::placeholder {
    color: #00ff8855;
  }
  input[type="file"] {
    padding: 8px 18px;
  }
  input:focus,
  select:focus,
  input[type="file"]:focus {
    outline: none;
    border-color: var(--accent-green);
    box-shadow: 0 0 15px var(--accent-green-glow), inset 0 0 25px var(--accent-green-glow);
    background: #005742cc;
  }

  /* Total bayar display */
  .total-label {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 2px;
    color: var(--accent-green);
    text-shadow: 0 0 7px #00ff8844;
  }
  #total-bayar {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 1.6rem;
    padding: 12px 20px;
    border-radius: 20px;
    background: #003d2424;
    border: 1.5px solid #008f56;
    color: var(--accent-green);
    text-shadow: 0 0 15px var(--accent-green);
    margin-bottom: 22px;
  }

  /* Button Kirim */
  .btn-pay {
    width: 100%;
    background: linear-gradient(90deg, #00ff88, #00cc6a);
    border: none;
    border-radius: 20px;
    font-weight: 900;
    font-size: 1.1rem;
    padding: 16px;
    cursor: pointer;
    color: #0a0d18;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    box-shadow:
      0 0 25px var(--accent-green-glow),
      inset 0 0 18px var(--accent-green);
    transition: all 0.3s ease;
  }
  .btn-pay:hover {
    background: linear-gradient(90deg, #00cc6a, #00ff88);
    box-shadow: 0 0 30px var(--accent-green-glow), inset 0 0 24px #00cc6a;
    transform: scale(1.05);
  }
  .btn-pay:active {
    transform: scale(0.95);
  }
  .btn-pay i {
    font-size: 1.2rem;
  }

  /* Tombol batal */
  .btn-cancel {
    margin-top: 15px;
    background: transparent;
    border: none;
    width: 100%;
    text-align: center;
    color: var(--danger);
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    text-shadow: 0 0 5px #ff4b57aa;
    transition: color 0.3s ease;
  }
  .btn-cancel:hover {
    color: #ff7583;
    text-shadow: 0 0 8px #ff7583bb;
  }

  /* QRIS Image */
  #qris-area {
    text-align: center;
    margin: 10px 0 20px;
  }
  #qris-area img {
    max-width: 200px;
    border-radius: 15px;
    border: 2px solid var(--accent-green);
    box-shadow: 0 0 20px var(--accent-green-glow);
  }
  #qris-area p {
    color: var(--accent-green);
    font-size: 12px;
    margin-top: 8px;
    text-shadow: 0 0 5px var(--accent-green-glow);
  }

  /* Floating Buttons */
  .sann-floating-group {
    position: fixed;
    bottom: 30px;
    right: 30px;
    display: flex;
    flex-direction: column-reverse;
    gap: 15px;
    z-index: 9999;
  }
  .btn-sann {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #00372a;
    border: 2px solid transparent;
    box-shadow: 0 0 18px var(--accent-green);
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn-sann:hover {
    transform: scale(1.2) translateY(-5px);
    border-color: var(--accent-green);
    box-shadow:
      0 0 30px var(--accent-green),
      0 10px 40px var(--accent-green);
  }
  .btn-sann img {
    width: 28px;
    filter: brightness(0) invert(1);
    transition: filter 0.3s ease;
  }
  .btn-sann:hover img {
    filter: brightness(1) saturate(3) hue-rotate(100deg);
  }

  /* Responsive */
  @media (max-width: 460px) {
    .order-container {
      padding: 25px 20px 35px;
      max-width: 350px;
    }
    .btn-sann {
      width: 48px;
      height: 48px;
    }
    .btn-sann img {
      width: 24px;
    }
  }
</style>
</head>
<body>

<!-- Floating buttons -->
<div class="sann-floating-group">
  <a href="https://wa.me/628989294545" target="_blank" class="btn-sann" title="WhatsApp CS">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" />
  </a>
  <a href="chat.html" class="btn-sann" title="Chat Manager">
    <img src="https://cdn-icons-png.flaticon.com/512/4233/4233830.png" alt="Chat" />
  </a>
  <a href="admin-produk.html" class="btn-sann" title="Panel Admin">
    <img src="https://cdn-icons-png.flaticon.com/512/3938/3938408.png" alt="Admin" />
  </a>
</div>

<!-- Order Form Container -->
<div class="order-container" role="form" aria-label="Form pemesanan produk">
  <h1 id="product-name" tabindex="0">Memuat...</h1>
  <p class="price" id="product-price">@ Rp 0</p>

  <form id="order-form" onsubmit="submitOrder(event)">
    <label for="input-ign">Masukkan IGN / Nickname</label>
    <input type="text" id="input-ign" name="ign" placeholder="Masukkan IGN / Nickname" required autocomplete="off" />

    <label for="input-qty">Jumlah</label>
    <input type="number" id="input-qty" name="qty" value="1" min="1" required oninput="updateTotal()" />

    <label for="input-method">Metode Pembayaran:</label>
    <select id="input-method" name="method" onchange="showQris(this.value)" required>
      <option value="DANA">DANA (08989294545)</option>
      <option value="GOPAY">GOPAY (08989294545)</option>
      <option value="QRIS">QRIS All Payment</option>
    </select>

    <div id="qris-area" style="display:none;">
      <img src="https://i.ibb.co/5hnkQRy6/1773671419683.jpg" alt="QRIS Payment" />
      <p>Scan QRIS di atas untuk membayar</p>
    </div>

    <div class="total-label">Total Bayar:</div>
    <div id="total-bayar">Rp 0</div>

    <label for="input-bukti">Upload Bukti Transfer:</label>
    <input type="file" id="input-bukti" name="bukti" accept="image/*" required />

    <button type="submit" class="btn-pay" id="btn-submit">
      <i class="fas fa-paper-plane"></i> KIRIM PESANAN
    </button>
    <button type="button" class="btn-cancel" onclick="resetForm()">✖ Batal</button>
  </form>
</div>

<!-- Scripts -->
<script>
  // Supabase config
  const SUPABASE_URL = "https://ybllqewkapqmtxknmqmd.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";

  // GAS webhook untuk terima data order + bukti base64
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyeXwWMMNpi1B7DThs13lk3JZlqWIV8NjdMwfvcEjMK9ywbzAxe258BE75RR74kw-pT1A/exec";

  let products = [];
  let activeProduct = null;

  // Elements references
  const productNameEl = document.getElementById("product-name");
  const productPriceEl = document.getElementById("product-price");
  const inputQty = document.getElementById("input-qty");
  const totalBayarEl = document.getElementById("total-bayar");
  const inputMethod = document.getElementById("input-method");
  const qrisArea = document.getElementById("qris-area");
  const btnSubmit = document.getElementById("btn-submit");

  // Fetch all products then set first active product
  async function fetchProducts() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/produk?order=id.asc`, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
        },
      });
      if(!res.ok) throw new Error("Gagal memuat produk");
      products = await res.json();

      if(products.length === 0) {
        productNameEl.textContent = "Produk Kosong";
        productPriceEl.textContent = "@ Rp 0";
        btnSubmit.disabled = true;
        return;
      }

      activeProduct = products[0]; // set produk pertama sebagai aktif
      updateProductDisplay();
      updateTotal();

    } catch (err) {
      productNameEl.textContent = "Gagal memuat produk";
      productPriceEl.textContent = "@ Rp 0";
      alert(err.message);
      btnSubmit.disabled = true;
    }
  }

  // Update produk aktif di UI
  function updateProductDisplay() {
    productNameEl.textContent = activeProduct.nama_produk;
    productPriceEl.textContent = '@ Rp ' + activeProduct.harga.toLocaleString('id-ID');
  }

  // Update total bayar
  function updateTotal() {
    let qty = parseInt(inputQty.value);
    if (!qty || qty < 1) qty = 1;
    inputQty.value = qty;
    const total = qty * activeProduct.harga;
    totalBayarEl.textContent = "Rp " + total.toLocaleString("id-ID");
  }

  // Show / hide QRIS area
  function showQris(val) {
    qrisArea.style.display = val === "QRIS" ? "block" : "none";
  }

  // Reset form
  function resetForm() {
    document.getElementById("order-form").reset();
    inputQty.value = 1;
    updateTotal();
    showQris("DANA");
  }

  // Sensor IGN (example: lewati ke server)
  function sensorIGN(name) {
    if (name.length <= 2) return name + "***";
    return name[0] + "***" + name[name.length -1];
  }

  // Submit order handler
  async function submitOrder(evt) {
    evt.preventDefault();

    const ign = document.getElementById("input-ign").value.trim();
    const qty = parseInt(inputQty.value);
    const method = inputMethod.value;
    const file = document.getElementById("input-bukti").files[0];

    if (!ign) return alert("⚠️ Lengkapi IGN / Nickname!");
    if (!file) return alert("⚠️ Upload bukti transfer terlebih dahulu!");
    if (qty < 1) return alert("⚠️ Jumlah minimal 1!");
    if (qty > activeProduct.stok) return alert("⚠️ Stok tidak mencukupi!");

    btnSubmit.disabled = true;
    btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim...';

    try {
      // 1. Kurangi stok produk
      await fetch(`${SUPABASE_URL}/rest/v1/produk?id=eq.${activeProduct.id}`, {
        method: "PATCH",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ stok: activeProduct.stok - qty }),
      });

      // 2. Simpan data penjualan
      const resJual = await fetch(`${SUPABASE_URL}/rest/v1/penjualan`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          Prefer: "return=representation",
        },
        body: JSON.stringify({
          ign,
          nama_item: activeProduct.nama_produk,
          jumlah: qty,
          total_bayar: qty * activeProduct.harga,
          status: "PENDING",
        }),
      });

      if (!resJual.ok) throw new Error("Gagal menyimpan data pemesanan");
      const jualData = await resJual.json();

      // 3. Upload bukti ke GAS via base64
      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64Image = e.target.result.split(",")[1];
        await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "upload_bukti",
            image: base64Image,
            id_jual: jualData[0].id,
            id_produk: activeProduct.id,
            jumlah_beli: qty,
            caption: `🔔 *PESANAN BARU SANN SHOP*\n\n👤 IGN: ${ign}\n📦 Item: ${activeProduct.nama_produk}\n🔢 Qty: ${qty}\n💰 Total: Rp ${(qty * activeProduct.harga).toLocaleString()}`,
          }),
        });

        alert("✅ Pesanan berhasil dikirim! Silakan tunggu konfirmasi admin dalam 5-10 menit.");
        resetForm();
      };
      reader.readAsDataURL(file);

      // Perbarui stok di UI sementara:
      activeProduct.stok -= qty;

    } catch (error) {
      alert("❌ Gagal mengirim pesanan: " + error.message);
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.innerHTML = '<i class="fas fa-paper-plane"></i> KIRIM PESANAN';
    }
  }

  // Event bindings
  inputQty.addEventListener("input", updateTotal);
  inputMethod.addEventListener("change", (e) => showQris(e.target.value));
  document.getElementById("order-form").addEventListener("submit", submitOrder);

  // Inisialisasi halaman
  fetchProducts();
  showQris("DANA");
</script>

</body>
                                             </html>
