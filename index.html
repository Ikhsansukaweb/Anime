<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donut Anime | Stable</title>
    <style>
        :root { --bg: #0b1117; --card: #161b22; --accent: #00e701; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; }
        .logo { font-size: 24px; text-align: center; color: var(--accent); font-weight: bold; margin: 20px 0; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #30363d; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .info { padding: 10px; }
        .title { font-size: 13px; font-weight: bold; height: 32px; overflow: hidden; }
        .btn { display: block; background: var(--accent); color: black; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>

<div class="logo">🍩 DONUT ANIME</div>

<div class="grid" id="anime-list">
    <p style="grid-column: span 2; text-align: center;">Menghubungkan ke Jikan API...</p>
</div>

<script>
    // Jikan API jauh lebih stabil dibanding Vercel/Wajick untuk urusan list anime
    async function loadAnime() {
        try {
            const res = await fetch('https://api.jikan.moe/v4/seasons/now?limit=10');
            const json = await res.json();
            const list = json.data;
            
            const container = document.getElementById('anime-list');
            container.innerHTML = "";
            
            list.forEach(anime => {
                container.innerHTML += `
                    <div class="card">
                        <img src="${anime.images.webp.image_url}">
                        <div class="info">
                            <div class="title">${anime.title}</div>
                            <a href="nonton.html?id=${anime.mal_id}&title=${encodeURIComponent(anime.title)}" class="btn">NONTON</a>
                        </div>
                    </div>
                `;
            });
        } catch (e) {
            document.getElementById('anime-list').innerHTML = "Koneksi Bermasalah. Coba pakai WiFi atau Mode Pesawat On/Off.";
        }
    }
    loadAnime();
</script>
</body>
</html>
