<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donut Anime | Sub Indo</title>
    <style>
        :root { --bg: #0b0e14; --card: #161b22; --accent: #00e701; --text: #8b949e; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; }
        header { padding: 15px; background: var(--card); border-bottom: 1px solid #30363d; text-align: center; }
        .logo { font-size: 22px; font-weight: bold; color: var(--accent); margin-bottom: 10px; }
        .search-box { padding: 10px; border-radius: 20px; border: 1px solid #444c56; background: #0d1117; color: white; width: 85%; outline: none; }
        .container { padding: 15px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .anime-card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid #30363d; }
        .anime-card img { width: 100%; height: 220px; object-fit: cover; }
        .info { padding: 10px; }
        .title { font-size: 13px; font-weight: bold; height: 35px; overflow: hidden; margin-bottom: 8px; }
        .btn-nonton { display: block; background: var(--accent); color: black; text-align: center; padding: 8px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 12px; }
        .history-item { background: #21262d; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--accent); font-size: 12px; }
    </style>
</head>
<body>

<header>
    <div class="logo">🍩 DONUT ANIME</div>
    <input type="text" id="search" class="search-box" placeholder="Cari anime sub indo..." onkeypress="handleSearch(event)">
</header>

<div class="container">
    <div id="history-section"></div>
    <h3 id="section-title">✨ Update Terbaru</h3>
    <div class="grid" id="anime-list">
        <p style="grid-column: span 2; text-align: center;">Memuat anime via Proxy...</p>
    </div>
</div>

<script>
    // PROXY adalah kunci agar tidak "Gagal Fetch"
    const PROXY = "https://api.allorigins.win/raw?url=";
    const API_BASE = "https://wajik-anime-api.vercel.app/otakudesu";
    const SB_URL = "https://alpiwaraxijqguwunroa.supabase.co/rest/v1";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFscGl3YXJheGlqcWd1d3Vucm9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MjY2MjMsImV4cCI6MjA4OTQwMjYyM30.WBaZGe4bEOcKdUXHEUe9nCtgfGO_ego6j0IfTcpiPY0";

    async function loadHome() {
        try {
            // Kita tembak lewat Proxy
            const res = await fetch(PROXY + encodeURIComponent(`${API_BASE}/ongoing`));
            const json = await res.json();
            displayAnime(json.data);
        } catch (e) {
            document.getElementById('anime-list').innerHTML = "Gagal memuat. Coba refresh halaman.";
        }
    }

    async function loadHistory() {
        try {
            const res = await fetch(`${SB_URL}/watch_history?username=eq.Tuan%20Derr&order=last_watched.desc&limit=3`, {
                headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}` }
            });
            const data = await res.json();
            if(data.length > 0) {
                let html = "<h3>🕒 Riwayat</h3>";
                data.forEach(h => {
                    html += `<div class="history-item"><b>${h.anime_id}</b></div>`;
                });
                document.getElementById('history-section').innerHTML = html;
            }
        } catch(e) {}
    }

    function displayAnime(list) {
        const container = document.getElementById('anime-list');
        container.innerHTML = "";
        list.forEach(anime => {
            const id = anime.id || anime.slug;
            container.innerHTML += `
                <div class="anime-card">
                    <img src="${anime.poster}" alt="Poster">
                    <div class="info">
                        <div class="title">${anime.title}</div>
                        <a href="nonton.html?id=${id}&title=${encodeURIComponent(anime.title)}" class="btn-nonton">NONTON</a>
                    </div>
                </div>
            `;
        });
    }

    async function handleSearch(e) {
        if (e.key === 'Enter') {
            document.getElementById('anime-list').innerHTML = "Mencari...";
            const res = await fetch(PROXY + encodeURIComponent(`${API_BASE}/search?q=${e.target.value}`));
            const json = await res.json();
            displayAnime(json.data);
        }
    }

    loadHome();
    loadHistory();
</script>
</body>
</html>
