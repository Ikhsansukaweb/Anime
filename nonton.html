<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching...</title>
    <style>
        body { background: #000; color: white; margin: 0; text-align: center; font-family: sans-serif; }
        iframe { width: 100%; height: 250px; border: none; background: #111; }
        .details { padding: 20px; }
        .back { color: #00e701; text-decoration: none; display: block; margin-top: 20px; }
    </style>
</head>
<body>

<div id="player-container">
    <div id="player-status" style="padding:100px 20px;">Menghubungkan ke Server Video...</div>
</div>

<div class="details">
    <h2 id="title">Memuat Judul...</h2>
    <p>Jika video tidak muncul, silakan tekan "Kembali" dan pilih anime lain.</p>
    <a href="index.html" class="back">← Kembali ke Beranda</a>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const title = urlParams.get('title');
    document.getElementById('title').innerText = title;

    // Trik: Langsung tembak ke provider embed yang paling stabil
    // Kita buat slug dari judul (kecilkan semua, ganti spasi dengan strip)
    const slug = title.toLowerCase().replace(/ /g, "-").replace(/[^\w-]/g, "");
    
    // Ganti player dengan Gogoanime embed (paling jarang diblokir)
    const playerUrl = `https://playtaku.net/streaming.php?id=${slug}-episode-1`;

    document.getElementById('player-container').innerHTML = `
        <iframe src="${playerUrl}" allowfullscreen></iframe>
    `;
</script>
</body>
</html>
